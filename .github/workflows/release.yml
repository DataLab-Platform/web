# ============================================================================
# Prepare and publish a DataLab-Web release (procedure: RELEASING.md and
# doc/releasing.md).
#
# Maintainers never create a GitHub release by hand. A release takes two
# steps, each one running this workflow, which relies on the release actions
# shared by the DataLab Platform projects
# (https://github.com/DataLab-Platform/release-actions):
#
# 1. "Prepare vX.Y.Z" - a maintainer pushes a release tag (created by
#    `node scripts/release.mjs`):
#      vX.Y.Z      final release, on `main`, both package.json at "X.Y.Z"
#      vX.Y.Z-rcN  release candidate, on any branch, at "X.Y.Z-rcN"
#    The tag is checked (format, CHANGELOG.md section, release branch, no
#    release already published), then the release guard and the versions,
#    pytest, Playwright, lint, Vitest and the release build run, and a DRAFT
#    GitHub release is created with the app and SDK tarballs, SHA256SUMS and
#    build provenance attestations. Nothing is published yet: on failure,
#    delete the tag, fix and tag again.
#
# 2. "Publish vX.Y.Z" - a maintainer reviews the draft release and publishes
#    it. The tarballs of the release are checked against SHA256SUMS and their
#    attestations; for a final release, the static bundle of the checked app
#    tarball is then deployed to GitHub Pages, so the site is exactly the
#    released bundle. A release created by hand has no such files: nothing is
#    deployed.
#
# A manual run (workflow_dispatch) is a dry run: the same checks, tests and
# tarballs, without draft release nor deployment.
# ============================================================================
name: Release

run-name: >-
  ${{ github.event_name == 'release' && 'Publish' || (github.event_name == 'push' && 'Prepare' || 'Dry run') }}
  ${{ github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NOTES_FILE: CHANGELOG.md
  NOTES_HEADING: "## [{version}]"

jobs:
  # ---------------------------------------------------------------------------
  # Step 1 - Prepare (tag push) or dry run (manual run).
  # ---------------------------------------------------------------------------
  check-tag:
    name: Check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The versions of both package.json files are checked by the verify job.
      - uses: DataLab-Platform/release-actions/check-tag@v1
        with:
          notes-file: ${{ env.NOTES_FILE }}
          notes-heading: ${{ env.NOTES_HEADING }}

  verify:
    name: Verify versions
    needs: check-tag
    # The tag is only checked on tag pushes (skipped for dry runs).
    if: ${{ !cancelled() && github.event_name != 'release' && needs.check-tag.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require published Sigima, guidata and DataLab-Capsule dependencies
        run: node scripts/check-sigima-release.mjs

      - name: Check tag matches package.json and SDK versions
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "app=$APP_VERSION sdk=$SDK_VERSION"
          if [ "$APP_VERSION" != "$SDK_VERSION" ]; then
            echo "::error::package.json ($APP_VERSION) and packages/sdk/package.json ($SDK_VERSION) versions disagree."
            exit 1
          fi
          # On a tag push, additionally enforce that the tag matches the
          # package version. Skipped on workflow_dispatch (dry run).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${APP_VERSION}."
              exit 1
            fi
            echo "Tag ${GITHUB_REF_NAME} matches package version ${APP_VERSION}."
          fi

  python-tests:
    name: Python ${{ matrix.python-version }} (pytest)
    runs-on: ubuntu-latest
    needs: verify
    env:
      DLW_REQUIRE_PROVENANCE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            sigima-dependency.json
            guidata-dependency.json
            datalab-capsule-dependency.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/sigima_dependency.py install --published
          python scripts/capsule_dependency.py install

      - name: Run pytest
        run: python -m pytest tests/python

  e2e:
    # Balanced parallel shards, as in ``tests.yml`` (see
    # ``scripts/e2e-shards.mjs``); ``pack`` waits for every shard.
    name: End-to-end (Playwright ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: verify
    env:
      DLW_REQUIRE_PROVENANCE: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Report runner hardware
        run: |
          echo "vCPUs: $(nproc)"
          lscpu | grep -E '^(Model name|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\))' || true
          free -h

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Select the spec files of this shard
        run: >-
          node scripts/e2e-shards.mjs plan
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --output "$RUNNER_TEMP/e2e-specs.txt"

      - name: Install the published DataLab-Capsule registry (optional feature, tested)
        run: |
          REQ=$(node -p "require('./datalab-capsule-dependency.json').publishedRequirement")
          python -m pip install "${REQ/==/[registry]==}"
          echo "DLW_REGISTRY_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "DLW_REQUIRE_REGISTRY=1" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          VITE_SIGIMA_INSTALL_SPEC: ""
          VITE_GUIDATA_INSTALL_SPEC: ""
          VITE_DATALAB_CAPSULE_INSTALL_SPEC: ""
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: |
          mapfile -t specs < "$RUNNER_TEMP/e2e-specs.txt"
          npm run test:e2e -- --reporter=github,blob "${specs[@]}"

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  e2e-report:
    name: End-to-end (Playwright report)
    runs-on: ubuntu-latest
    needs: e2e
    # Not when publishing a release, where the tests are not run.
    if: ${{ !cancelled() && github.event_name != 'release' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: blob-report
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./blob-report

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  pack:
    name: Build & pack (app + SDK)
    runs-on: ubuntu-latest
    needs: [verify, python-tests, e2e]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build app bundle
        run: npm run build:release

      - name: Pack SDK tarball
        run: npm run sdk:pack

      - name: Pack app tarball
        run: npm run app:pack

      - name: List release artefacts
        run: ls -lh release/

      - name: Upload tarballs as workflow artefacts
        uses: actions/upload-artifact@v7
        with:
          name: datalab-web-release
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create the draft release
    # Skipped for dry runs, where check-tag is skipped.
    needs: [check-tag, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # required by the build provenance attestation
      attestations: write   # required by the build provenance attestation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: datalab-web-release
          path: release

      - uses: DataLab-Platform/release-actions/create-draft@v1
        with:
          name: DataLab-Web
          files: release/*.tgz
          notes-file: ${{ env.NOTES_FILE }}
          notes-heading: ${{ env.NOTES_HEADING }}

  # ---------------------------------------------------------------------------
  # Step 2 - Publish: check the tarballs of the published release, then deploy
  # the site of a final release from the checked app tarball.
  # ---------------------------------------------------------------------------
  publish:
    name: Check the release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # download the files of the release
      attestations: read  # verify their build provenance
    steps:
      - uses: DataLab-Platform/release-actions/verify-release@v1
        with:
          files: |
            datalab-web-*.tgz
            datalab-platform-web-sdk-*.tgz
          output-dir: release

      - uses: actions/upload-artifact@v7
        with:
          name: checked-app-tarball
          path: release/datalab-web-*.tgz
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: publish
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: checked-app-tarball
          path: release

      - name: Extract the static bundle of the app tarball
        run: |
          mkdir site
          tar -xzf release/datalab-web-*.tgz -C site --strip-components=1
          # Added by scripts/pack-app.mjs for integrators, not part of the
          # built bundle (dist/).
          rm site/DEPLOY.md site/LICENSE
          test -f site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
