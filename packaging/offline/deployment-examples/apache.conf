# Use inside the release directory (AllowOverride FileInfo Headers required)
# or copy the directives into the matching <Directory> virtual-host block.

DirectoryIndex index.html
Options -Indexes -MultiViews

AddType application/wasm .wasm
AddType text/javascript .js .mjs
AddType application/json .json .map
AddType application/octet-stream .whl .zip .bz2 .data

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "no-referrer"

  <FilesMatch "^(index\.html|runtime-config\.json|VERSION\.json)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>

  <FilesMatch "\.(wasm|whl|zip|bz2|data)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>

# Do not add an index.html fallback: real missing Pyodide and wheel files must
# remain 404 responses.