# Unpack the release under /srv/www/tools/datalab/ and include these locations
# in the HTTPS server block. The same rules work at / by adjusting the prefix.

location /tools/datalab/ {
    root /srv/www;
    index index.html;
    try_files $uri $uri/ =404;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location ~ ^/tools/datalab/(index\.html|runtime-config\.json|VERSION\.json)$ {
    root /srv/www;
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/tools/datalab/assets/ {
    root /srv/www;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/tools/datalab/(pyodide|wheels)/ {
    root /srv/www;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json map;
    application/wasm wasm;
    application/octet-stream whl zip bz2 data;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
    font/ttf ttf;
}